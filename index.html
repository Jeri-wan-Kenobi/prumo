<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>Prumo</title>
<meta name="theme-color" content="#EEF3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prumo">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<script>(()=>{try{const t=localStorage.getItem('prumo:theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  --bg:#EEF3F2;--surface:#FFFFFF;--inset:#EEF3F2;--ink:#0E2226;--muted:#4B6265;--line:#D3DEDD;
  --action:#0F5E6B;--action-ink:#FFFFFF;--good:#1F7A5C;--warn:#8A5810;--bad:#B23B2E;
  --good-soft:#DDEFE6;--warn-soft:#F3E7D2;--bad-soft:#F8E1DD;
  --hero:#0F5E6B;--hero-sub:#CFE5E8;--ocre:#E3A94B;--jade:#6FD0B0;--coral:#FF8A7A;--on-block:#1A1405;
  --font:"Sora","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;--rs:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1719;--surface:#13262A;--inset:#0B1719;--ink:#EAF1F0;--muted:#9DB4B4;--line:#25403F;
    --action:#4FB3C2;--action-ink:#0B1719;--good:#6FD0B0;--warn:#E3A94B;--bad:#FF8A7A;
    --good-soft:#17363B;--warn-soft:#33280F;--bad-soft:#3E2027;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1719;--surface:#13262A;--inset:#0B1719;--ink:#EAF1F0;--muted:#9DB4B4;--line:#25403F;
  --action:#4FB3C2;--action-ink:#0B1719;--good:#6FD0B0;--warn:#E3A94B;--bad:#FF8A7A;
  --good-soft:#17363B;--warn-soft:#33280F;--bad-soft:#3E2027;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
/* sem zoom por toque duplo ou pinça; rolagem e toques continuam normais */
body,button,a,input,select,textarea,label,[role=tab]{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
/* tela fixa como app nativo: html e body não rolam nem "quicam"; só #rolagem rola, e só na vertical */
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
#rolagem{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:env(safe-area-inset-top,0px) 16px calc(100px + env(safe-area-inset-bottom,0px))}
.sheet{overscroll-behavior:contain;touch-action:pan-y}
/* troca de aba com deslize */
@media (prefers-reduced-motion:no-preference){
  #view.vem-dir{animation:vemDir .2s ease-out}#view.vem-esq{animation:vemEsq .2s ease-out}
  @keyframes vemDir{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
  @keyframes vemEsq{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
}
/* celular deitado: o iPhone não deixa travar a rotação, então o app pede para voltar à vertical */
#girar{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#girar svg{width:56px;height:56px;color:var(--ocre)}
@media (orientation:landscape) and (max-height:540px){#girar{display:flex}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.2;font-weight:600;text-wrap:balance}
h2{font-size:1.02rem}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.84rem}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:.8rem;color:var(--muted)}
.top-r{display:flex;align-items:center;gap:8px}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok{background:var(--good)}.sync.err{background:var(--bad)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;position:relative;color:var(--ink)}
.icon-btn::before{content:"";position:absolute;inset:-4px}
.icon-btn svg{width:19px;height:19px}
.icon-btn[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.set{display:flex;flex-direction:column;gap:8px}
.set h3{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.setrow .tx b{display:block;font-weight:600;font-size:.95rem}
.setrow .tx span{display:block;font-size:.8rem;color:var(--muted)}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--action)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.hr{height:1px;background:var(--line);margin:2px 0}
/* o iPhone dá zoom ao focar campos com texto menor que 16px */
input,select,textarea{font-size:max(16px,1em)}
.verdict.mini .vn{font-size:1.5rem}
.verdict.mini .vn .de{opacity:.6;font-weight:600}
.login{display:flex;flex-direction:column;gap:14px;margin-top:8vh}
.login .err{color:var(--bad);font-size:.86rem;font-weight:600}

.panel{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.link{border:0;background:transparent;color:var(--action);font-weight:600;font-size:.84rem;cursor:pointer;padding:10px 0;min-height:44px}

/* herói */
.hero{background:var(--hero);color:#fff;border-radius:var(--r);padding:20px 22px 16px}
.hero .lbl{font-size:.88rem;font-weight:500;color:var(--hero-sub)}
.hero .big{font-weight:600;font-size:clamp(2.4rem,12vw,3.3rem);line-height:1;letter-spacing:-.03em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.3em;font-weight:500;color:var(--hero-sub);letter-spacing:0;margin-left:6px}
.hero .ctx{font-size:.88rem;color:var(--hero-sub)}
.hero .ctx b{color:#fff;font-weight:600}
.hero.neg{background:var(--coral);color:var(--on-block)}
.hero.neg .lbl,.hero.neg .ctx,.hero.neg .cap{color:#5A231B}
.segs{display:flex;gap:4px;margin-top:16px}
.segs i{flex:1;height:22px;border-radius:4px;background:rgba(255,255,255,.16)}
.segs i.on{background:var(--ocre)}
.hero .cap{font-size:.76rem;color:var(--hero-sub);margin-top:7px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--inset);border-radius:var(--rs);padding:10px 12px;min-width:0}
.tile span{display:block;font-size:.75rem;color:var(--muted)}
.tile b{display:block;font-size:1.05rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.box > .tiles{margin-top:10px}

/* dica */
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:36px;height:36px;border-radius:var(--rs);background:var(--inset);display:grid;place-items:center;flex:none}
.tip .ic svg{width:20px;height:20px}
.tip .tt{font-weight:600;font-size:.88rem}
.tip .tx{font-size:.86rem;line-height:1.45;margin-top:2px}
.tip .x{width:44px;height:44px;margin:-10px -12px 0 0;border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;flex:none}
.tip.pos .tt{color:var(--good)}.tip.urg .tt{color:var(--warn)}.tip.bad .tt{color:var(--bad)}

/* atalho do simulador */
.simcta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.simcta .ic{width:36px;height:36px;border-radius:var(--rs);background:var(--inset);display:grid;place-items:center;flex:none;color:var(--action)}
.simcta .ic svg{width:20px;height:20px}
.simcta .tx{display:block;color:var(--ink)}
.simcta b{display:block;font-weight:600;font-size:.95rem}
.simcta .sb{display:block;font-size:.8rem;color:var(--muted)}
.simcta .chev{margin-left:auto;color:var(--muted)}

/* listas */
.list{list-style:none;margin:6px 0 0;padding:0}
.it{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;position:relative}
.chk::before{content:"";position:absolute;inset:-9px}
.chk svg{width:14px;height:14px;opacity:0}
.it.done .chk,.chk.on{background:var(--good);border-color:var(--good)}
.it.done .chk svg,.chk.on svg{opacity:1;color:var(--surface)}
.it .nm{font-weight:600;cursor:pointer;min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.it .mt{font-size:.78rem;color:var(--muted)}
.it .mt .late{color:var(--bad);font-weight:600}
.it .mt .soon{color:var(--warn);font-weight:600}
.it .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap;font-size:.95rem}
.it.done .nm,.it.done .v{color:var(--muted);text-decoration:line-through}
.it.plain{grid-template-columns:minmax(0,1fr) auto}

.btn{border:1px solid var(--line);background:var(--surface);padding:0 16px;min-height:48px;border-radius:12px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.full{width:100%}
input[type=text],input[type=email],input[type=password],input[type=date],select{font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:12px;width:100%;min-height:46px}
input.money{color:var(--ink);font-size:2rem;font-weight:600;border:0;border-bottom:2px solid var(--action);border-radius:0;padding:4px 0;background:transparent;width:100%;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-height:0}
input.money:focus{outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);font-weight:500}
.note{background:var(--warn-soft);border-radius:var(--rs);padding:10px 12px;font-size:.86rem}
.info{background:var(--inset);border-radius:var(--rs);padding:10px 12px;font-size:.84rem;color:var(--muted)}

.cycle-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cycle-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.cycle-nav .c{text-align:center}
.cycle-nav .c b{font-size:1.2rem;font-weight:600;display:block}
.cycle-nav .c span{font-size:.78rem;color:var(--muted)}

.debt{padding:14px 0;border-top:1px solid var(--line)}
.debt:first-child{border-top:0;padding-top:4px}
.debt .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.debt .hd b{font-weight:600;cursor:pointer}
.debt .cost{font-size:.72rem;padding:2px 8px;border-radius:6px;background:var(--inset);color:var(--muted);white-space:nowrap}
.debt .cost.hot{background:var(--bad-soft);color:var(--bad)}
.debt .cost.mid{background:var(--warn-soft);color:var(--warn)}
.debt .cost.zero{background:var(--good-soft);color:var(--good)}
.debt .sub{font-size:.8rem;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--inset);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--action);border-radius:3px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:0 14px;min-height:44px;min-width:48px;cursor:pointer;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--action);color:var(--action-ink);border-color:var(--action)}

/* simulador */
.simhead{display:flex;align-items:center;gap:4px;padding:14px 0 6px}
.simhead button{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;margin-left:-10px;color:var(--ink)}
.simhead h1{font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.verdict{border-radius:var(--r);padding:16px 20px;color:var(--on-block)}
.verdict.tr{background:var(--jade)}
.verdict.at{background:var(--surface);border:2px solid var(--ocre);color:var(--ink)}
.verdict.arr{background:var(--ocre)}
.verdict.nc{background:var(--coral)}
.verdict .lv{font-weight:700;font-size:.95rem}
.verdict .lb{font-size:.82rem;margin-top:6px;opacity:.85}
.verdict.at .lb{color:var(--muted);opacity:1}
.verdict .vn{font-weight:700;font-size:2.2rem;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.verdict .vs{display:flex;gap:3px;margin:10px 0}
.verdict .vs i{flex:1;height:14px;border-radius:3px;background:rgba(0,0,0,.16)}
.verdict .vs i.on{background:var(--on-block)}
.verdict.at .vs i{background:var(--line)}
.verdict.at .vs i.on{background:var(--ocre)}
.verdict .vt{font-size:.88rem;line-height:1.45}
.verdict .alt{margin-top:8px;font-size:.84rem;line-height:1.4;padding-top:8px;border-top:1px solid rgba(0,0,0,.14)}
.verdict.at .alt{border-top-color:var(--line)}
.eff{padding:11px 0;border-top:1px solid var(--line)}
.eff:first-of-type{border-top:0}
.eff .k{font-size:.8rem;color:var(--muted)}
.eff .v{font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.eff .v .from{color:var(--muted)}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:48px;font-size:.68rem;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-selected="true"]{color:var(--action)}
.nav .add{width:56px;height:56px;border-radius:50%;background:var(--action);color:var(--action-ink);margin:-22px auto 0;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.nav .add svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;background:rgba(5,12,13,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* ---------- V6.1: teclado ---------- */
:root{--kb:0px;--vvh:100vh}
.sheet{bottom:var(--kb)!important;max-height:calc(var(--vvh) - var(--kb) - 24px)!important;transition:bottom .18s ease-out}
.sheet-in > .row:last-child{position:sticky;bottom:-18px;margin:0 -18px -18px;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -10px 14px -10px rgba(0,0,0,.35);z-index:2}
body.kb-aberto .sheet-in > .row:last-child{padding-bottom:12px}
#rolagem{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px) + var(--kb))}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left}
label.f{min-width:0}
.grab{cursor:grab;padding:6px 0;margin:-6px auto 0;background-clip:content-box;height:16px;box-sizing:border-box}
input.kp{caret-color:transparent;cursor:pointer}
input.kp.ativo{border-color:var(--action)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--action) 35%,transparent)}
input.money.kp.ativo{box-shadow:none;border-bottom-width:3px}
#teclado{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
@media (prefers-reduced-motion:no-preference){#teclado{animation:tecSobe .16s ease-out}@keyframes tecSobe{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}}
#teclado .barra{display:flex;justify-content:space-between;align-items:center;padding:0 6px;min-height:36px}
#teclado .barra span{font-size:.82rem;color:var(--muted)}
#teclado .barra button{border:0;background:transparent;color:var(--action);font:inherit;font-weight:700;font-size:.92rem;min-height:36px;padding:0 6px;cursor:pointer}
#teclado .grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#teclado .grade button{min-height:52px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:1.35rem;font-weight:600;cursor:pointer;touch-action:manipulation}
#teclado .grade button.sec{background:var(--inset);border:1px solid var(--line);font-size:1.1rem}
#teclado .grade button:active{background:var(--action);color:var(--action-ink)}
#teclado .grade svg{width:26px;height:26px}
@media (max-height:700px){#teclado .grade button{min-height:44px}}
/* configuração inicial: o botão Continuar fica sempre acima do teclado */
.onb #oNext{position:sticky;bottom:calc(var(--kb) + 12px);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* telas baixas com teclado aberto: veredito compacto, como no mockup da tela menor */
@media (max-height:720px){body.kb-aberto .sheet .verdict.mini .vt,body.kb-aberto .sheet-in > p.small{display:none}body.kb-aberto .sheet .verdict.mini{padding:10px 14px}}
.saldo-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.saldo-card .v{font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}
/* ---------- V6 ---------- */
.onb{display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 140px);padding-top:8px}
.onb h1{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;margin:0}
.onb .lead{font-size:.95rem;color:var(--muted);line-height:1.5;margin:0}
.onb .grow{flex:1}
.prog{display:flex;gap:6px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--ocre)}
.daygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.daygrid .chip{min-height:52px;border-radius:12px;font-size:1rem}

(() => {
  // iPhone: o Safari ignora user-scalable=no; estes eventos de gesto só existem nele
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
  // pinça com dois dedos (iPhone e Android): cancela só quando há mais de um dedo, a rolagem segue normal
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, {passive: false});
  // toque duplo: resolvido pelo touch-action: manipulation no CSS, sem atrasar nem bloquear toques rápidos em botões
  // Android: guarda o pedido de instalação para o botão "Instalar o app"
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__pedidoInstalar = e; window.dispatchEvent(new Event('prumo:instalavel')); });
})();

<script type="module">
import { FIREBASE_CONFIG } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, createUserWithEmailAndPassword, sendEmailVerification, updateProfile, deleteUser, reauthenticateWithCredential, EmailAuthProvider } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, doc, onSnapshot, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
(() => {
'use strict';

/* ---------- utilidades ---------- */
const vc = (maiusc) => (S && S.nome) ? (maiusc ? 'Você' : 'você') : (maiusc ? 'O senhor' : 'o senhor');
const topo = () => { const r = document.getElementById('rolagem'); if (r) r.scrollTop = 0; };
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let HIDE = false;
try { HIDE = localStorage.getItem('prumo:hide') === '1'; } catch (e) {}
const brl = v => HIDE ? 'R$ •••' : (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const r2 = v => Math.round(v * 100) / 100;
const parseMoney = s => { s = String(s || '').trim().replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? r2(n) : NaN; };
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const ymAdd = (c, k) => { let [y, m] = c.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); };
const cLabel = c => { const [y, m] = c.split('-').map(Number); return MES[m - 1] + '/' + String(y).slice(2); };
const ddmm = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M5 12l5 5 9-10"/></svg>';
const IC = {
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
  calc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>',
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>'
};

/* ---------- estado ---------- */
let S = null;
let DOCREF = null, saveTimer = null, lastLocalEdit = 0;
let USER, CLOUD_EMPTY = false, unsub = null;
let telaAuth = 'login', PRECISA_VERIF = false, ONB = {passo: 1, salario: '', dia: 0, saldo: ''};
let tab = 'hoje', viewCycle = null;
let sim = null;

const dia = () => (S && S.diaSalario) || 24;
// Cada ciclo leva o nome do mês em que o salário cai e as contas são pagas:
// o salário de 24/09 abre o ciclo "set", que paga (adiantado) as contas que vencem em outubro.
const cicloDe = d => { const y = d.getFullYear(), m = d.getMonth() + 1; return d.getDate() >= dia() ? y + '-' + pad(m) : ymAdd(y + '-' + pad(m), -1); };
const cicloInicio = c => { const [y, m] = c.split('-').map(Number); return new Date(y, m - 1, dia()); };
const cicloFim = c => { const d = cicloInicio(ymAdd(c, 1)); d.setDate(d.getDate() - 1); return d; };
const hojeC = () => cicloDe(today());

function valorEm(it, c) {
  if (it.sched && Object.prototype.hasOwnProperty.call(it.sched, c)) return it.sched[c];
  if (it.valor == null || !it.de || c < it.de) return null;
  if (it.rec) return it.valor;
  if (it.n && c <= ymAdd(it.de, it.n - 1)) return it.valor;
  return null;
}
function ultimoCiclo(it) {
  let last = null;
  if (it.sched) for (const k in it.sched) if (it.sched[k] != null && (!last || k > last)) last = k;
  if (!it.rec && it.n && it.de) { const e = ymAdd(it.de, it.n - 1); if (!last || e > last) last = e; }
  return last;
}
function ciclosDe(it) {
  const set = new Set();
  if (it.sched) for (const k in it.sched) if (it.sched[k] != null) set.add(k);
  if (!it.rec && it.n && it.de) for (let i = 0; i < it.n; i++) set.add(ymAdd(it.de, i));
  return [...set].sort();
}
function vencData(it, c) {
  if (!it.dia) return null;
  const [y, m] = c.split('-').map(Number);
  return it.dia >= dia() ? new Date(y, m - 1, it.dia) : new Date(y, m, it.dia);
}
const pago = (c, id) => !!(S.pagos && S.pagos[c] && S.pagos[c][id]);
const itensDo = c => S.itens.map(it => ({it, v: valorEm(it, c)})).filter(x => x.v != null && x.v > 0);
const gastosDo = c => S.gastos.filter(g => cicloDe(new Date(g.data + 'T00:00:00')) === c);
const entradasDo = c => S.entradas.filter(e => e.ciclo === c);
const contaEntrada = e => e.tipo === 'resgate' || e.recebido;

function resumo(c) {
  const semSal = (S.semSalario || []).includes(c);
  const salario = semSal ? 0 : S.salario;
  const inicial = (S.saldoInicial && S.saldoInicial[c]) || 0;
  const ents = entradasDo(c);
  const entradas = r2(ents.filter(contaEntrada).reduce((a, e) => a + e.valor, 0));
  const pendente = r2(ents.filter(e => !contaEntrada(e)).reduce((a, e) => a + e.valor, 0));
  const itens = itensDo(c);
  const compromissos = r2(itens.reduce((a, x) => a + x.v, 0));
  const pagoV = r2(itens.filter(x => pago(c, x.it.id)).reduce((a, x) => a + x.v, 0));
  const gastos = r2(gastosDo(c).reduce((a, g) => a + g.valor, 0));
  const aportes = r2((S.aportes || []).filter(a => a.c === c).reduce((a, x) => a + x.v, 0));
  return {semSal, salario, inicial, entradas, pendente, compromissos, pagoV, gastos, aportes};
}
// sobra acumulada ao fim do ciclo c
function sobra(c) {
  let carry = 0, cur = S.inicio;
  if (c < cur) return {carry: 0, fim: 0, r: resumo(c)};
  while (true) {
    const r = resumo(cur);
    const fim = r2(carry + r.inicial + r.salario + r.entradas - r.compromissos - r.gastos - r.aportes);
    if (cur === c) return {carry: r2(carry), fim, r};
    carry = fim; cur = ymAdd(cur, 1);
  }
}
// sobra própria do ciclo (sem herdar o anterior): usada no simulador
function propria(c) {
  if (c <= hojeC()) return sobra(c).fim;
  const r = resumo(c);
  return r2(r.inicial + r.salario + r.entradas - r.compromissos - r.aportes);
}
function dividasInfo() {
  const lst = S.itens.filter(it => it.divida !== false).map(it => {
    const cs = ciclosDe(it).filter(k => k >= S.inicio);
    const pend = cs.filter(k => !pago(k, it.id));
    const rest = r2(pend.reduce((a, k) => a + (valorEm(it, k) || 0), 0));
    const totalV = r2(cs.reduce((a, k) => a + (valorEm(it, k) || 0), 0));
    return {it, cs, pend, rest, totalV, fim: ultimoCiclo(it)};
  });
  const ativas = lst.filter(d => d.rest > 0);
  return {
    lst, ativas,
    total: r2(ativas.reduce((a, d) => a + d.rest, 0)),
    geral: r2(lst.reduce((a, d) => a + d.totalV, 0)),
    livreEm: ativas.reduce((m, d) => !m || d.fim > m ? d.fim : m, null)
  };
}

/* ---------- tema ---------- */
function themeMode() { try { return localStorage.getItem('prumo:theme') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(m) {
  const r = document.documentElement;
  if (m === 'light' || m === 'dark') r.dataset.theme = m; else delete r.dataset.theme;
  try { localStorage.setItem('prumo:theme', m); } catch (e) {}
}

/* ---------- ocultar valores ---------- */
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
function paintEye() {
  const b = document.getElementById('eyeBtn');
  b.innerHTML = HIDE ? EYE_OFF : EYE;
  b.setAttribute('aria-pressed', HIDE);
  b.setAttribute('aria-label', HIDE ? 'Mostrar valores' : 'Ocultar valores');
}
function setHide(on) {
  HIDE = on;
  try { localStorage.setItem('prumo:hide', on ? '1' : '0'); } catch (e) {}
  paintEye(); render();
}

/* ---------- migração ---------- */
// A versão 2 do app avançou um mês o que é ligado ao período (marcando cicloContas = 1).
// Esta versão volta ao mês do pagamento: desfaz esse avanço uma única vez e marca cicloContas = 2.
// (O valor 2 também impede que um aparelho ainda com a versão 2 converta de novo.)
function migrar(d) {
  if (!d) return d;
  if (d.cicloContas === 1) {
    const sh = k => ymAdd(k, -1);
    const shKeys = o => o ? Object.fromEntries(Object.entries(o).map(([k, v]) => [sh(k), v])) : o;
    if (d.inicio) d.inicio = sh(d.inicio);
    d.saldoInicial = shKeys(d.saldoInicial);
    d.dispensadas = shKeys(d.dispensadas);
    if (Array.isArray(d.semSalario)) d.semSalario = d.semSalario.map(sh);
    (d.entradas || []).forEach(e => { if (e.ciclo) e.ciclo = sh(e.ciclo); });
  }
  d.cicloContas = 2;
  // V6: campos novos. Quem já usa o app não vê o tutorial.
  if (!d.v6Desde) { d.v6Desde = isoDate(today()); if (d.tutorialVisto === undefined) d.tutorialVisto = true; }
  d.reserva = d.reserva || {meta: 0, base: 0};
  d.aportes = d.aportes || [];
  d.fechados = d.fechados || {};
  return d;
}

/* ---------- persistência (Firebase) ---------- */
let LS = 'prumo:cache';
// texto estável (chaves em ordem) para comparar estados sem falso alarme
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
function setSync(t, cls) { const el = document.getElementById('sync'); el.className = 'sync' + (cls ? ' ' + cls : ''); el.setAttribute('aria-label', t); el.title = t; }
function cacheLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function save() {
  cacheLocal();
  if (!DOCREF) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}
function flush() {
  if (!DOCREF || !S) return;
  // sem internet, o Firestore guarda no aparelho e envia sozinho quando a conexão voltar
  setDoc(DOCREF, JSON.parse(JSON.stringify(S))).catch(e => setSync('Não salvou na nuvem (' + (e && e.code || 'erro') + ')', 'err'));
}
/* ---------- desfazer ---------- */
const UNDO = [];
function mutate(fn, msg) {
  UNDO.push({snap: JSON.stringify(S), msg: msg || 'Alteração'});
  if (UNDO.length > 30) UNDO.shift();
  lastLocalEdit = Date.now(); fn(); save(); render();
  toast(msg || 'Alteração salva', undo);
}
function undo() {
  const u = UNDO.pop(); if (!u) return;
  lastLocalEdit = Date.now();
  S = JSON.parse(u.snap); if (!S) CLOUD_EMPTY = true; closeSheet(); save(); render();
  toast('Desfeito (' + u.msg + ')', UNDO.length ? undo : null);
}
const recentEdit = () => Date.now() - lastLocalEdit < 1500;

let AUTH = null;
function initFirebase() {
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('COLE')) { USER = 'sem-config'; render(); return; }
  const app = initializeApp(FIREBASE_CONFIG);
  AUTH = getAuth(app);
  const fs = initializeFirestore(app, {localCache: persistentLocalCache()});
  onAuthStateChanged(AUTH, u => {
    if (unsub) { unsub(); unsub = null; }
    USER = u || null; DOCREF = null; S = null; CLOUD_EMPTY = false; PRECISA_VERIF = false; UNDO.length = 0; sim = null; tab = 'hoje'; ONB = {passo: 1, salario: '', dia: 0, saldo: ''};
    if (!u) { setSync('Desconectado', 'err'); render(); return; }
    LS = 'prumo:cache:' + u.uid;
    try { const raw = localStorage.getItem(LS); if (raw) S = migrar(JSON.parse(raw)); } catch (e) {}
    DOCREF = doc(fs, 'usuarios', u.uid, 'dados', 'estado');
    setSync('Conectando');
    render();
    unsub = onSnapshot(DOCREF, {includeMetadataChanges: true}, snap => {
      const pend = snap.metadata.hasPendingWrites, cache = snap.metadata.fromCache;
      if (pend) setSync('Salvo no aparelho, aguardando internet');
      else if (cache) setSync('Sem internet: mostrando a última cópia');
      else setSync('Sincronizado', 'ok');
      if (pend) return;
      if (snap.exists()) {
        CLOUD_EMPTY = false;
        if (recentEdit()) return;
        const raw = snap.data(), antigo = raw.cicloContas !== 2 || !raw.v6Desde;
        const data = migrar(JSON.parse(JSON.stringify(raw)));
        if (antigo) { S = data; UNDO.length = 0; save(); render(); return; } // grava a versão convertida na nuvem
        if (stable(data) === stable(S)) return;
        if (S) UNDO.length = 0; // mudou em outro aparelho: o histórico local não vale mais
        S = data; cacheLocal(); render();
      } else if (!cache) {
        // a nuvem está vazia (primeiro acesso): se houver cópia local, ela sobe; se não, tela de boas-vindas
        if (S) flush(); else { CLOUD_EMPTY = true; render(); }
      }
    }, e => {
      if (e && e.code === 'permission-denied' && USER && !USER.emailVerified) { PRECISA_VERIF = true; render(); return; }
      setSync('Erro de sincronização (' + (e && e.code || 'erro') + ')', 'err');
    });
  });
}

/* ---------- dicas ---------- */
function dicas(c) {
  const out = [];
  const s = sobra(c), r = s.r, t = today();
  const ini = cicloInicio(c), fim = cicloFim(c);
  const decorridos = Math.max(1, Math.round((t - ini) / 864e5) + 1);
  const restantes = Math.max(1, Math.round((fim - t) / 864e5) + 1);
  const livre = s.fim;
  const ritmo = r.gastos / decorridos;
  const temSaldo = !(r.semSal && !(S.saldoInicial && c in S.saldoInicial));

  // 1. ritmo alto
  if (temSaldo && r.gastos > 0 && livre > 0 && ritmo * restantes > livre) {
    const falta = r2(ritmo * restantes - livre);
    out.push({id: 'ritmo-alto', kind: 'bad', icon: IC.alert, t: 'Ritmo acima do limite',
      x: 'Gastando ' + brl(r2(ritmo)) + ' por dia, faltariam ' + brl(falta) + ' no fim do ciclo. Para fechar, o limite é ' + brl(r2(livre / restantes)) + ' por dia.'});
  }
  if (temSaldo && livre < 0) {
    out.push({id: 'negativo', kind: 'bad', icon: IC.alert, t: 'O ciclo não fecha',
      x: 'Faltam ' + brl(-livre) + '. Antes de pegar crédito, veja se dá para adiar algum pagamento sem juros ou receber um valor pendente.'});
  }
  // 2. vencimentos próximos
  const prox = [];
  [c, ymAdd(c, 1)].forEach(cc => itensDo(cc).forEach(x => { if (pago(cc, x.it.id)) return; const d = vencData(x.it, cc); if (!d) return; const n = Math.round((d - t) / 864e5); if (n <= 3) prox.push({x, n, d}); }));
  prox.sort((a, b) => a.n - b.n);
  prox.forEach(p => out.push({id: 'venc-' + p.x.it.id + '-' + isoDate(p.d), kind: 'urg', icon: IC.clock,
    t: p.n < 0 ? 'Venceu em ' + ddmm(p.d) : p.n === 0 ? 'Vence hoje' : 'Vence em ' + p.n + (p.n === 1 ? ' dia' : ' dias'),
    x: p.x.it.nome + ': ' + brl(p.x.v) + (p.n < 0 ? '. Se já pagou, marque como pago na aba Mês.' : ' no dia ' + ddmm(p.d) + '. Deixe o valor separado com antecedência.')}));
  // 3. resgate planejado perto dos vencimentos
  const resg = entradasDo(c).find(e => e.tipo === 'resgate' && !e.recebido);
  if (resg && prox.some(p => p.n >= 0 && p.n <= 3)) out.push({id: 'resgate-' + resg.id, kind: 'urg', icon: IC.inbox, t: 'Hora de resgatar',
    x: resg.nome + ' (' + brl(resg.valor) + '). Até lá, não use o cartão: o limite disponível é o mesmo dinheiro.'});
  // 4. sem lançamentos
  const ult = S.gastos.reduce((m, g) => g.data > m ? g.data : m, '');
  if (temSaldo && ult) {
    const diasSem = Math.round((t - new Date(ult + 'T00:00:00')) / 864e5);
    if (diasSem >= 3) out.push({id: 'sem-lanc-' + isoDate(t), kind: 'urg', icon: IC.clock, t: 'Faz ' + diasSem + ' dias sem lançamentos',
      x: 'Está tudo registrado? As dicas e o "Posso gastar hoje" só ficam certos com os gastos em dia.'});
  }
  // 5. a receber
  entradasDo(c).filter(e => e.tipo !== 'resgate' && !e.recebido).forEach(e => out.push({id: 'rec-' + e.id, kind: 'urg', icon: IC.inbox, t: 'Valor a receber neste ciclo',
    x: e.nome + ': ' + brl(e.valor) + '. Quando chegar, marque como recebido para entrar na conta.'}));
  // 6. dívida quitada
  dividasInfo().lst.forEach(d => {
    if (!d.cs.length || d.rest > 0 || !d.fim || d.fim < ymAdd(c, -1)) return;
    const v = valorEm(d.it, d.fim);
    out.push({id: 'quit-' + d.it.id, kind: 'pos', icon: IC.star, t: d.it.nome + ' quitado!',
      x: (v ? brl(v) + ' por mês ficam livres a partir de ' + cLabel(ymAdd(d.fim, 1)) + '. ' : '') + 'Sugestão: usar esse valor para antecipar a dívida mais cara.'});
  });
  // 7. ritmo bom
  if (temSaldo && r.gastos > 0 && decorridos >= 3 && livre > 0 && ritmo * restantes < livre * 0.7) {
    const folga = r2(livre - ritmo * restantes);
    out.push({id: 'ritmo-bom', kind: 'pos', icon: IC.bulb, t: 'Ritmo bom',
      x: vc(true) + ' está gastando ' + brl(r2(ritmo)) + ' por dia. Mantendo assim, sobram cerca de ' + brl(folga) + ' para o próximo ciclo.'});
  }
  // 8. marco
  const di = dividasInfo();
  if (di.geral > 0) {
    const pct = 1 - di.total / di.geral;
    [0.75, 0.5, 0.25].some(m => { if (pct >= m) { out.push({id: 'marco-' + m, kind: 'pos', icon: IC.star, t: Math.round(m * 100) + '% das dívidas pagas',
      x: 'Faltam ' + brl(di.total) + '. Livre de dívidas em ' + cLabel(di.livreEm) + ', se nada novo entrar.'}); return true; } return false; });
  }
  // 9. lembrete de backup
  const lb = lastBackup(), desde = lb ? new Date(lb) : new Date((S.v6Desde || isoDate(t)) + 'T00:00:00');
  const diasBk = Math.floor((t - new Date(desde.getFullYear(), desde.getMonth(), desde.getDate())) / 864e5);
  if (diasBk >= 7) out.push({id: 'backup-' + isoDate(t), kind: 'urg', icon: IC.inbox, t: lb ? 'Faz ' + diasBk + ' dias sem backup' : 'Faça seu primeiro backup',
    x: 'Em Ajustes › Exportar backup. Leva poucos segundos e protege seus dados.'});
  const disp = (S.dispensadas && S.dispensadas[c]) || [];
  return out.filter(d => !disp.includes(d.id));
}

/* ---------- simulador ---------- */
const LV = {tr: 'Tranquilo', at: 'Atenção', arr: 'Arriscado', nc: 'Não cabe'};
const nivel = min => { const sal = S.salario || 1; return min < 0 ? 'nc' : min < 0.1 * sal ? 'arr' : min < 0.2 * sal ? 'at' : 'tr'; };
const RANK = {nc: 0, arr: 1, at: 2, tr: 3};
function simular(valor, n, start) {
  const parc = r2(valor / n);
  let min = Infinity, mes = start;
  for (let i = 0; i < n; i++) { const c = ymAdd(start, i); const v = r2(propria(c) - parc); if (v < min) { min = v; mes = c; } }
  return {parc, min: r2(min), mes, nv: nivel(min), fim: ymAdd(start, n - 1)};
}
function viewSim() {
  const c = hojeC();
  if (!sim) sim = {valor: '', n: 6, start: ymAdd(c, 1), nome: ''};
  const opts = Array.from({length: 13}, (_, k) => ymAdd(c, k)).map(k => '<option value="' + k + '"' + (k === sim.start ? ' selected' : '') + '>' + cLabel(k) + (k === c ? ' (atual)' : '') + '</option>').join('');
  const ns = [1, 2, 3, 4, 5, 6, 8, 10, 12];
  return '<div class="simhead"><button id="simBack" aria-label="Voltar">' + IC.back + '</button><h1>Antes de comprar</h1></div>' +
    '<section class="box" style="display:flex;flex-direction:column;gap:14px">' +
    '<label class="f">Valor total da compra<input class="money" id="sV" inputmode="decimal" placeholder="R$ 0,00" value="' + esc(sim.valor) + '"></label>' +
    '<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted)">Parcelas<div class="chips" id="sN">' + ns.map(k => '<button type="button" class="chip" data-n="' + k + '" aria-pressed="' + (k === sim.n) + '">' + k + 'x</button>').join('') + '</div></div>' +
    '<label class="f">Primeira parcela no ciclo de<select id="sC">' + opts + '</select></label>' +
    '</section><div id="simOut" style="display:flex;flex-direction:column;gap:12px"></div>';
}
// Veredito + efeitos de uma compra parcelada. modo 'sim' (antes de comprar) ou 'gasto' (compra já feita).
function veredito(valor, n, start, modo) {
  const res = simular(valor, n, start);
  const sal = S.salario || 1;
  const on = Math.max(0, Math.min(10, Math.round(res.min / (0.2 * sal) * 10)));
  let txt = '', alt = '';
  if (res.nv === 'tr') txt = 'Cabe com folga: o mês mais apertado continua acima de 20% do salário.';
  if (res.nv === 'at') txt = 'Cabe, mas ' + cLabel(res.mes) + ' fica apertado.';
  if (res.nv === 'arr') txt = cLabel(res.mes) + ' ficaria com ' + brl(res.min) + ' para o mês inteiro.';
  if (res.nv === 'nc') txt = modo === 'gasto' ? cLabel(res.mes) + ' não fecha. Vale rever outros gastos desse mês ou antecipar um valor a receber.' : 'Na prática, isso vira outra dívida para cobrir a falta.';
  if (res.nv !== 'tr') {
    let best = null;
    [1, 2, 3, 4, 5, 6, 8, 10, 12].forEach(k => { if (k === n || (modo === 'gasto' && k === 1)) return; const t = simular(valor, k, start); if (!best || t.min > best.min) best = {k, ...t}; });
    if (best && RANK[best.nv] > RANK[res.nv]) alt += (modo === 'gasto' ? 'Se ainda der para escolher, em ' : 'Em ') + best.k + 'x o mês mais apertado fica com ' + brl(best.min) + ' (' + LV[best.nv].toLowerCase() + '). ';
    if (modo !== 'gasto') for (let i = 1; i <= 18; i++) { const st = ymAdd(start, i); const t = simular(valor, n, st); if (t.nv === 'tr') { alt += 'Começando em ' + cLabel(st) + ', cabe com folga: a menor sobra seria ' + brl(t.min) + '.'; break; } }
  }
  const di = dividasInfo();
  const novoFim = !di.livreEm || res.fim > di.livreEm ? res.fim : di.livreEm;
  const pend = r2(resumo(res.mes).pendente);
  const html =
    '<section class="verdict ' + res.nv + '" aria-live="polite"><div class="lv">' + LV[res.nv] + '</div>' +
    '<div class="lb">' + (res.nv === 'nc' ? cLabel(res.mes) + ' ficaria negativo em' : 'Menor sobra, em ' + cLabel(res.mes)) + '</div>' +
    '<div class="vn">' + brl(res.nv === 'nc' ? -res.min : res.min) + '</div>' +
    '<div class="vs" aria-hidden="true">' + segs(on) + '</div>' +
    '<div class="vt">' + esc(txt) + '</div>' + (alt ? '<div class="alt">' + esc(alt.trim()) + '</div>' : '') + '</section>' +
    '<section class="box"><h2>Efeitos</h2>' +
    '<div class="eff"><div class="k">Parcela</div><div class="v">' + n + 'x de ' + brl(res.parc) + ', de ' + cLabel(start) + ' a ' + cLabel(res.fim) + '</div></div>' +
    '<div class="eff"><div class="k">Total ainda a pagar</div><div class="v"><span class="from">' + brl(di.total) + '</span> para ' + brl(r2(di.total + valor)) + '</div></div>' +
    '<div class="eff"><div class="k">Livre de dívidas em</div><div class="v">' + (novoFim === di.livreEm ? cLabel(novoFim) + ' (não muda)' : '<span class="from">' + (di.livreEm ? cLabel(di.livreEm) : 'agora') + '</span> para ' + cLabel(novoFim)) + '</div></div>' +
    (pend > 0 ? '<p class="small muted" style="margin-top:6px">Não considera ' + brl(pend) + ' a receber em ' + cLabel(res.mes) + ' que ainda não chegaram.</p>' : '') +
    '</section>';
  return {res, html};
}
function simOut() {
  const el = document.getElementById('simOut'); if (!el) return;
  const valor = parseMoney(sim.valor);
  if (!(valor > 0)) { el.innerHTML = '<p class="info">Digite o valor da compra para ver o efeito nos próximos meses.</p>'; return; }
  const {res, html} = veredito(valor, sim.n, sim.start, 'sim');
  el.innerHTML = html +
    '<label class="f">Nome da compra (para adicionar)<input type="text" id="sNome" maxlength="40" placeholder="Ex.: pedaleira" value="' + esc(sim.nome) + '"></label>' +
    '<div class="row" style="flex-wrap:nowrap"><button class="btn primary" style="flex:1" id="simLater">Deixar para depois</button><button class="btn" style="flex:1" id="simAdd">Adicionar mesmo assim</button></div>';
  document.getElementById('sNome').oninput = e => { sim.nome = e.target.value; };

// Efeito de um gasto à vista hoje no "Posso gastar hoje" e no livre do ciclo
function impactoVista(val) {
  const c = hojeC(), s = sobra(c), r = s.r;
  if (r.semSal && !(S.saldoInicial && c in S.saldoInicial)) return '<p class="info">Informe o saldo disponível na tela Hoje para ver o impacto dos gastos.</p>';
  const dias = Math.max(1, Math.round((cicloFim(c) - today()) / 864e5) + 1);
  const livre = s.fim, porDia = livre > 0 ? r2(livre / dias) : 0;
  const livre2 = r2(livre - val), porDia2 = livre2 > 0 ? r2(livre2 / dias) : 0;
  let nv, tit, txt;
  if (livre2 < 0) { nv = 'nc'; tit = 'Não cabe no ciclo'; txt = 'O ciclo ficaria negativo em ' + brl(-livre2) + ' até o salário de ' + ddmm(cicloInicio(ymAdd(c, 1))) + '.'; }
  else if (val <= porDia) { nv = 'tr'; tit = 'Cabe no limite de hoje'; txt = 'Ainda sobram ' + brl(r2(porDia - val)) + ' do limite de hoje.'; }
  else if (porDia2 >= porDia * 0.8) { nv = 'at'; tit = 'Passa do limite de hoje'; txt = 'Passa ' + brl(r2(val - porDia)) + ' do limite de hoje, mas os próximos dias quase não mudam.'; }
  else { nv = 'arr'; tit = 'Aperta os próximos dias'; txt = 'Passa ' + brl(r2(val - porDia)) + ' do limite de hoje e reduz o que sobra para cada dia até o salário.'; }
  return '<section class="verdict mini ' + nv + '" aria-live="polite"><div class="lv">' + tit + '</div>' +
    '<div class="lb">Posso gastar por dia</div><div class="vn"><span class="de">' + brl(porDia) + ' →</span> ' + brl(porDia2) + '</div>' +
    '<div class="vt">' + esc(txt) + ' Livre no ciclo: ' + brl(livre) + ' → ' + brl(livre2) + '.</div></section>';
}

/* ---------- ajustes e backup ---------- */
const BK_FMT = 'prumo-backup';
function lastBackup() { try { return localStorage.getItem('prumo:lastBackup'); } catch (e) { return null; } }
function lastBackupTxt() {
  const v = lastBackup();
  if (!v) return 'Nenhum backup feito neste aparelho.';
  const d = new Date(v), n = Math.round((today() - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return 'Último backup: ' + ddmm(d) + '/' + d.getFullYear() + (n === 0 ? ' (hoje)' : n === 1 ? ' (ontem)' : ' (há ' + n + ' dias)') + '.';
}
function validState(d) {
  return d && typeof d === 'object' && Array.isArray(d.itens) && Array.isArray(d.gastos) && Array.isArray(d.entradas) &&
    typeof d.inicio === 'string' && /^\d{4}-\d{2}$/.test(d.inicio) && typeof d.salario === 'number';
}
async function exportBackup() {
  if (!S) return;
  const now = new Date();
  const body = JSON.stringify({formato: BK_FMT, versao: 1, exportadoEm: now.toISOString(), dados: S}, null, 2);
  const filename = 'prumo-backup-' + isoDate(now) + '.json';
  const done = () => { try { localStorage.setItem('prumo:lastBackup', now.toISOString()); } catch (e) {} toast('Backup salvo'); const el = document.getElementById('bkLast'); if (el) el.textContent = lastBackupTxt(); };
  // iPhone: abre a folha de compartilhar (Salvar em Arquivos). Computador: baixa o arquivo.
  try {
    const file = new File([body], filename, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: 'Backup do Prumo'}); done(); }
      catch (e) { toast(e && e.name === 'AbortError' ? 'Backup cancelado' : 'Não foi possível compartilhar o arquivo'); }
      return;
    }
  } catch (e) {}
  try {
    const url = URL.createObjectURL(new Blob([body], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); done();
  } catch (e) { toast('Não foi possível salvar o arquivo aqui'); }
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onerror = () => toast('Não consegui ler o arquivo');
  rd.onload = () => {
    let j; try { j = JSON.parse(rd.result); } catch (e) { toast('Arquivo inválido: não é um backup do Prumo'); return; }
    const d = j && j.formato === BK_FMT ? j.dados : j;
    if (!validState(d)) { toast('Arquivo inválido: não é um backup do Prumo'); return; }
    const quando = j && j.exportadoEm ? new Date(j.exportadoEm) : null;
    sheet('<h2>Importar backup?</h2>' +
      '<div class="tiles"><div class="tile"><span>Compromissos</span><b>' + d.itens.length + '</b></div><div class="tile"><span>Gastos</span><b>' + d.gastos.length + '</b></div>' +
      '<div class="tile"><span>A receber</span><b>' + d.entradas.length + '</b></div><div class="tile"><span>Feito em</span><b>' + (quando && !isNaN(quando) ? ddmm(quando) + '/' + String(quando.getFullYear()).slice(2) : '?') + '</b></div></div>' +
      '<p class="note">Os dados atuais serão substituídos pelos do arquivo. Se mudar de ideia, toque em Desfazer logo em seguida.</p>' +
      '<div class="row" style="flex-wrap:nowrap"><button class="btn primary" id="impOk" style="flex:1">Substituir dados</button><button class="btn ghost" data-close>Cancelar</button></div>',
      el => el.querySelector('#impOk').onclick = () => { closeSheet(); mutate(() => { S = migrar(JSON.parse(JSON.stringify(d))); }, 'Backup importado'); });
  };
  rd.readAsText(file);
}

function favoritos() {
  const m = {};
  (S.gastos || []).forEach(g => { const k = g.cat + '|' + (g.desc || '').toLowerCase() + '|' + g.valor; (m[k] = m[k] || {cat: g.cat, desc: g.desc || '', valor: g.valor, n: 0, t: 0}); m[k].n++; m[k].t = Math.max(m[k].t, g.t || 0); });

// ---------- calculadora "para onde vai o dinheiro extra"
const jurosDe = it => { if (it.juros != null && it.juros !== '') return +it.juros; const m = String(it.custo || '').match(/(\d+(?:[.,]\d+)?)\s*%/); return m ? parseFloat(m[1].replace(',', '.')) : null; };
function economia(d, extra, c) {
  const i = jurosDe(d.it); if (!(i > 0)) return null;
  const parcelas = d.pend.map(k => ({k, v: valorEm(d.it, k) || 0, m: Math.max(0, (Number(k.slice(0, 4)) - Number(c.slice(0, 4))) * 12 + Number(k.slice(5)) - Number(c.slice(5)))})).reverse();
  let resto = extra, quitadas = 0, valorQuitado = 0;
  for (const pz of parcelas) {
    const custo = pz.v / Math.pow(1 + i / 100, pz.m);
    if (resto >= custo) { resto -= custo; quitadas++; valorQuitado += pz.v; }
    else { valorQuitado += resto * Math.pow(1 + i / 100, pz.m); resto = 0; break; }
  }
  const usado = r2(extra - resto);
  return {i, usado, eco: r2(valorQuitado - usado), quitadas};
}

  V.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    const e = S.entradas.find(x => x.id === b.dataset.rec);
    mutate(() => { e.recebido = !e.recebido; }, e.recebido ? 'Desmarcado: ' + e.nome : (e.tipo === 'resgate' ? 'Marcado como resgatado' : 'Marcado como recebido'));
  });
  V.querySelectorAll('[data-ent]').forEach(b => b.onclick = () => sheetEntrada(S.entradas.find(x => x.id === b.dataset.ent)));
  V.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => mutate(() => {
    const c = hojeC(); S.dispensadas = Object.assign({}, S.dispensadas || {});
    S.dispensadas = Object.fromEntries(Object.entries(S.dispensadas).filter(([k]) => k >= ymAdd(c, -1)));
    S.dispensadas[c] = [...(S.dispensadas[c] || []), b.dataset.dismiss];
  }, 'Dica dispensada'));
  V.querySelectorAll('[data-go]').forEach(b => b.onclick = () => irAba(b.dataset.go));
  V.querySelectorAll('[data-cy]').forEach(b => b.onclick = () => { viewCycle = ymAdd(viewCycle || hojeC(), +b.dataset.cy); if (viewCycle < S.inicio) viewCycle = S.inicio; render(); });
  V.querySelectorAll('[data-ini]').forEach(b => b.onclick = () => sheetSaldo(b.dataset.ini));
  V.querySelectorAll('[data-saldo]').forEach(b => b.onclick = () => sheetSaldo(b.dataset.saldo));
  const os = V.querySelector('#openSim'); if (os) os.onclick = () => sheetGasto(null, 'simular');
  const sal = V.querySelector('#salEdit'); if (sal) sal.onclick = sheetSalario;
  const ni = V.querySelector('#newItem'); if (ni) ni.onclick = sheetNovoItem;
  const ne = V.querySelector('#newEnt'); if (ne) ne.onclick = () => sheetEntrada(null);
  if (tab === 'sim') bindSim(V);
  V.querySelectorAll('[data-passo]').forEach(b => b.onclick = () => { const k = b.dataset.passo; if (k === 'gasto') sheetGasto(null); else sheetNovoItem(k); });
  const po = V.querySelector('#passosOk'); if (po) po.onclick = () => mutate(() => { S.novato = false; }, 'Primeiros passos concluídos');
  const fe = V.querySelector('#fechar'); if (fe) fe.onclick = sheetFechamento;
  const rb = V.querySelector('#resBtn'); if (rb) rb.onclick = sheetReserva;
  const xb = V.querySelector('#extraBtn'); if (xb) xb.onclick = sheetExtra;
}

const ABAS = ['hoje', 'mes', 'dividas', 'receber'];
function irAba(nova, doVoltar) {
  if (!S || nova === tab) return;
  const de = ABAS.indexOf(tab), para = ABAS.indexOf(nova);
  if (!doVoltar) {
    if (nova !== 'hoje' && !histAba) { histAba = true; history.pushState({prumo: 'aba'}, ''); }
    else if (nova === 'hoje' && histAba) { histAba = false; voltarHist(); }
  }
  tab = nova; viewCycle = null; render(); topo();
  const v = document.getElementById('view');
  v.classList.remove('vem-dir', 'vem-esq'); void v.offsetWidth;
  v.classList.add(de === -1 || para > de ? 'vem-dir' : 'vem-esq');
}
document.querySelectorAll('.nav [role=tab]').forEach(b => b.onclick = () => irAba(b.dataset.tab));
// Deslize horizontal: para a esquerda avança de aba, para a direita volta.
// Só conta se for claramente horizontal, rápido e longe das bordas (onde fica o "voltar" do Android).
(() => {
  const area = document.getElementById('rolagem');
  let x0 = 0, y0 = 0, t0 = 0, valido = false;
  area.addEventListener('touchstart', e => {
    const t = e.touches[0];
    valido = e.touches.length === 1 && !document.querySelector('#layer .sheet') && ABAS.includes(tab) &&
      t.clientX > 24 && t.clientX < window.innerWidth - 24 && !e.target.closest('input, select, textarea');
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, {passive: true});
  area.addEventListener('touchend', e => {
    if (!valido) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Date.now() - t0 > 600 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    const i = ABAS.indexOf(tab), j = dx < 0 ? i + 1 : i - 1;
    if (j >= 0 && j < ABAS.length) irAba(ABAS[j]);
  }, {passive: true});
})();
document.getElementById('addBtn').onclick = () => { if (S) sheetGasto(null); };
document.getElementById('eyeBtn').onclick = () => { setHide(!HIDE); toast(HIDE ? 'Valores ocultos' : 'Valores visíveis'); };
document.getElementById('setBtn').onclick = sheetAjustes;
paintEye();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

applyTheme(themeMode());
prepararCampos(document);
aplicarKb();
try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {}); } catch (e) {}
render();
initFirebase();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
})();
</script>
</body>
</html>
